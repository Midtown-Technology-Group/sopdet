name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: gate (fmt, vet, tests, schema parity)
        run: make fmt-check vet test schema-check

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
      - name: analyzer + PowerShell 3.0 compatibility
        run: make analyzer compat-check

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: cross-compile
        run: make cross

  # Real Windows execution: both implementations collect back-to-back and the
  # equivalence gate fails the build when their envelopes diverge. Also runs
  # go vet natively so Windows-only files get vetted (cross vet skips them).
  equivalence:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: vet (native Windows coverage)
        run: go vet ./...
      - name: equivalence (Go vs PowerShell envelopes)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-equivalence.ps1
      - name: collect native Go coverage
        shell: pwsh
        run: |
          go test -coverprofile=coverage-windows-unit.out ./...
          New-Item -ItemType Directory -Force .coverage-windows | Out-Null
          go build -cover -o sopdet-cover.exe ./cmd/sopdet
          $env:GOCOVERDIR = (Resolve-Path .coverage-windows).Path
          .\sopdet-cover.exe -profile full -dry-run -out coverage-windows.json
      - name: convert native Go coverage
        shell: cmd
        run: |
          go tool covdata textfmt -i=.coverage-windows -o=coverage-windows.out
      - name: Upload native Go coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonar-coverage-windows
          path: coverage-windows*.out
          if-no-files-found: error
      - name: Upload envelopes on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: equivalence-envelopes
          path: ${{ runner.temp }}/sopdet-equiv/*.json

  # Real macOS execution: build native and validate a collected envelope.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: build
        run: go build -o sopdet ./cmd/sopdet
      - name: collect (quick, dry-run)
        run: ./sopdet -profile full -dry-run -out out.json
      - name: validate against schema
        run: go run ./cmd/schemacheck schema/inventory.schema.json out.json
      - name: summary
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("out.json"))
          print("macOS entities:", len(d["entities"]), sorted(d["entities"].keys()))
          print("entity_errors:", list(d.get("entity_errors", {}).keys()))
          PY
      - name: collect native Go coverage
        run: |
          go test -coverprofile=coverage-macos-unit.out ./...
          mkdir .coverage-macos
          go build -cover -o sopdet-cover ./cmd/sopdet
          GOCOVERDIR="$PWD/.coverage-macos" ./sopdet-cover -profile full -dry-run -out coverage-macos.json
          go tool covdata textfmt -i=.coverage-macos -o=coverage-macos.out
      - name: Upload native Go coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonar-coverage-macos
          path: coverage-macos*.out
          if-no-files-found: error

  coverage:
    permissions:
      contents: read
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: unit coverage
        run: go test -coverprofile=coverage-linux-unit.out ./...
      - name: native integration coverage
        run: |
          mkdir .coverage-linux
          go build -cover -o sopdet-cover ./cmd/sopdet
          GOCOVERDIR="$PWD/.coverage-linux" ./sopdet-cover -profile full -dry-run -out coverage-linux.json
          go tool covdata textfmt -i=.coverage-linux -o=coverage-linux-integration.out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonar-coverage-linux
          path: coverage-linux-*.out
          if-no-files-found: error

  coverage-bundle:
    permissions:
      contents: read
    needs: [coverage, equivalence, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: sonar-coverage-*
          path: sonar-coverage
          merge-multiple: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonar-coverage
          path: sonar-coverage/*.out
          if-no-files-found: error

  sonar:
    permissions:
      contents: read
    needs: coverage-bundle
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: Midtown-Technology-Group/engineering-workflows/.github/workflows/sonar.yml@bc3b6f7099177c00ac728d6d32d83fc8dcf76d84
    with:
      project-key: Midtown-Technology-Group_sopdet
      organization: midtown-technology-group
      coverage-artifact: sonar-coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
