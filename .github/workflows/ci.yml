name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: gate (fmt, vet, tests, schema parity)
        run: make fmt-check vet test schema-check

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
      - name: analyzer + PowerShell 3.0 compatibility
        run: make analyzer compat-check

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: cross-compile
        run: make cross

  # Real macOS execution: build native and validate a collected envelope.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - name: build
        run: go build -o sopdet ./cmd/sopdet
      - name: collect (quick, dry-run)
        run: ./sopdet -profile full -dry-run -out out.json
      - name: validate against schema
        run: go run ./cmd/schemacheck schema/inventory.schema.json out.json
      - name: summary
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("out.json"))
          print("macOS entities:", len(d["entities"]), sorted(d["entities"].keys()))
          print("entity_errors:", list(d.get("entity_errors", {}).keys()))
          PY
